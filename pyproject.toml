[project]
name = "restful-booker-tests"
version = "1.2.0"
description = "API autotests for restful booker"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest==2.16.0",
    "allure-python-commons==2.16.0",
    "annotated-types==0.7.0",
    "attrs==26.1.0",
    "certifi==2026.4.22",
    "charset-normalizer==3.4.7",
    "colorama==0.4.6",
    "execnet==2.1.2",
    "faker==40.15.0",
    "idna==3.13",
    "iniconfig==2.3.0",
    "packaging==26.2",
    "pluggy==1.6.0",
    "pre-commit==4.6.2",
    "pydantic==2.13.3",
    "pydantic-core==2.46.3",
    "pydantic-settings==2.14.0",
    "pygments==2.20.0",
    "pytest==9.0.3",
    "pytest-rerunfailures==16.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "python-dotenv==1.2.2",
    "requests==2.33.1",
    "ruff==0.15.12",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "tzdata==2026.2",
    "urllib3==2.6.3",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "smoke: smoke tests",
    "regression: regression tests",
]
addopts = [
    "--alluredir=allure-results",
    "--strict-markers",
    "-ra",
    "-n 3",
    "--reruns=2",
    "--reruns-delay=1",
    "--timeout=60",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", "allure-results", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E",    # Ошибки PEP8 (лишние пробелы, неправильные отступы)
    "W",    # Предупреждения PEP8 (Лишние пустые строки)
    "F",    # Неиспользуемые импорты/переменные
    "I",    # Сортировка импортов
    "B",    # Потенциальные баги (assert False)
    "UP",   # Устаревший синтаксис (type вместо isinstanse)
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "B008",    # function call in default arg (Pydantic Field)
    "RUF001",  # cyrillic ambiguous chars (тексты на русском)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert allowed in tests

[tool.ruff.format]
quote-style = "double"
